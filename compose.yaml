services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: usuarios
      POSTGRES_USER: usuarios
      POSTGRES_PASSWORD: usuarios
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuarios -d usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/usuarios
      DB_USER: usuarios
      DB_PASSWORD: usuarios
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
